<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CRUD Cargos com ApiService</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/univap-theme.css" rel="stylesheet" />
  <script src="js/bootstrap.bundle.min.js"></script>
  <style>
    body { margin: 0; }
    table { margin-top: 1em; }
  </style>
</head>

<body>
  <div id="app-topbar"></div>
  <main class="container conteudo-pagina" id="conteudo-principal">

  <h1 class="mb-4">Gerenciamento de Cargos</h1>

  <!-- FILTRO -->
  <div class="card mb-3">
    <div class="card-header">Filtro de Cargo</div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <label for="txtFiltroCargo" class="form-label">Nome do Cargo</label>
          <input type="text" id="txtFiltroCargo" class="form-control" placeholder="Digite o nome do cargo">
        </div>
        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="chkMostrarInativos">
            <label class="form-check-label" for="chkMostrarInativos">Mostrar cargos inativos (deletados)</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CADASTRO -->
  <div class="card mb-3">
    <div class="card-header">Cadastro de Cargo</div>
    <div class="card-body">
      <div class="mb-3">
        <input type="text" id="txtId" class="form-control mb-2" disabled placeholder="ID (para update ou delete)" aria-label="ID do cargo selecionado" />
        <input type="text" id="txtNomeCargo" class="form-control mb-2" placeholder="Nome" aria-label="Nome do cargo" />
      </div>
      <div class="mb-3 d-flex gap-2" id="divBotoes"></div>
      <div id="divResposta" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- LISTAGEM -->
  <div class="card mt-4">
    <div class="card-header">Lista de Cargos</div>
    <div class="card-body">
      <div id="divTabela"></div>
    </div>
  </div>

  <!-- MODAL DE CONFIRMAÇÃO -->
  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-labelledby="modalConfirmLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalConfirmLabel">Confirmar Exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">Tem certeza que deseja excluir este cargo?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  </main>

  <script type="module">
    import { montarTopbar } from './js/Topbar.js';
    import ApiService from './ApiService.js';

    let userData = localStorage.getItem("userData");
    if (userData) {
      userData = JSON.parse(userData);
    } else {
      window.location.href = "login.html";
    }
    const token = userData.data.token;
    const api = new ApiService(token);
    montarTopbar('cargos');

    let API_DATA;
    let endpointAtual = "api/v1/cargos"; // padrão: ativos

    const txtId = document.getElementById("txtId");
    const txtNomeCargo = document.getElementById("txtNomeCargo");
    const txtFiltroCargo = document.getElementById("txtFiltroCargo");
    const chkMostrarInativos = document.getElementById("chkMostrarInativos");
    const divBotoes = document.getElementById("divBotoes");
    const divResposta = document.getElementById("divResposta");

    function createButton(text, className) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.className = `btn ${className} flex-fill`;
      return btn;
    }

    function mostrarMensagem(mensagem, tipo = "success") {
      divResposta.textContent = mensagem;
      divResposta.className = `alert alert-${tipo}`;
    }

    // ---------- BOTÕES ----------
    const btnListar = createButton("Listar", "btn-primary");
    btnListar.onclick = () => listAll();
    divBotoes.appendChild(btnListar);

    const btnCriar = createButton("Criar", "btn-success");
    btnCriar.onclick = async () => {
      const nome = txtNomeCargo.value.trim();
      if (!nome) {
        mostrarMensagem("Informe o nome do cargo", "warning");
        return;
      }
      const objeto = { cargo: { nomeCargo: nome } };
      const resposta = await api.post("api/v1/cargos", objeto);
      if (resposta.success) {
        mostrarMensagem(resposta.message || "Cargo criado com sucesso", "success");
        // Após criar, recarrega a lista mantendo o estado atual (inativos ou ativos)
        listAll();
        txtNomeCargo.value = "";
      } else {
        mostrarMensagem(resposta.message || "Erro ao criar cargo", "danger");
        if (resposta.error) console.error(resposta.error);
      }
    };
    divBotoes.appendChild(btnCriar);

    const btnAtualizar = createButton("Atualizar", "btn-warning");
    btnAtualizar.onclick = async () => {
      const id = txtId.value.trim();
      if (!id) {
        mostrarMensagem("Selecione um cargo para atualizar", "warning");
        return;
      }
      const nome = txtNomeCargo.value.trim();
      if (!nome) {
        mostrarMensagem("Informe o nome do cargo", "warning");
        return;
      }
      const objeto = { cargo: { nomeCargo: nome } };
      const resposta = await api.put("api/v1/cargos", id, objeto);
      if (resposta.success) {
        mostrarMensagem(resposta.message || "Cargo atualizado com sucesso", "success");
        listAll();
        txtId.value = "";
        txtNomeCargo.value = "";
      } else {
        mostrarMensagem(resposta.message || "Erro ao atualizar cargo", "danger");
        if (resposta.error) console.error(resposta.error);
      }
    };
    divBotoes.appendChild(btnAtualizar);

    const btnExcluir = createButton("Excluir", "btn-danger");
    btnExcluir.onclick = () => {
      const id = txtId.value.trim();
      if (!id) {
        mostrarMensagem("Selecione um cargo para excluir", "warning");
        return;
      }
      const modal = new bootstrap.Modal(document.getElementById('modalConfirm'));
      modal.show();
      const btnConfirmDelete = document.getElementById("btnConfirmDelete");
      btnConfirmDelete.onclick = async () => {
        const resposta = await api.delete("api/v1/cargos", id);
        if (resposta.success) {
          mostrarMensagem(resposta.message || "Cargo excluído com sucesso", "success");
          listAll();
          txtId.value = "";
          txtNomeCargo.value = "";
        } else {
          mostrarMensagem(resposta.message || "Erro ao excluir cargo", "danger");
          if (resposta.error) console.error(resposta.error);
        }
        modal.hide();
      };
    };
    divBotoes.appendChild(btnExcluir);

    // ---------- LISTAR (com suporte a inativos) ----------
    async function listAll() {
      const endpoint = chkMostrarInativos.checked ? "api/v1/cargos/deleted" : "api/v1/cargos";
      endpointAtual = endpoint;

      const resposta = await api.get(endpoint);
      if (resposta.success) {
        API_DATA = resposta.data;
        renderTable(API_DATA);
        divResposta.className = "";
      } else {
        mostrarMensagem(resposta.message || "Erro ao carregar cargos", "danger");
        if (resposta.error) console.error(resposta.error);
      }
    }

    // ---------- RENDERIZAR TABELA ----------
    function renderTable(dados) {
      const divTabela = document.getElementById("divTabela");
      divTabela.innerHTML = "";

      const table = document.createElement("table");
      table.className = "table table-bordered table-striped";

      const thead = document.createElement("thead");
      thead.className = "table-light";
      const trHead = document.createElement("tr");
      ["ID", "Nome Cargo", "Ações"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      const cargos = dados?.cargos || [];
      cargos.forEach(cargo => {
        const tr = document.createElement("tr");
        const tdId = document.createElement("td");
        tdId.textContent = cargo.idCargo;
        tr.appendChild(tdId);

        const tdNome = document.createElement("td");
        tdNome.textContent = cargo.nomeCargo;
        tr.appendChild(tdNome);

        const tdAcoes = document.createElement("td");
        const divBtns = document.createElement("div");
        divBtns.className = "d-flex gap-2";

        const btnSel = createButton("Selecionar", "btn-info");
        btnSel.onclick = () => {
          txtId.value = cargo.idCargo;
          txtNomeCargo.value = cargo.nomeCargo;
          divResposta.className = "";
          divResposta.textContent = "";
        };
        divBtns.appendChild(btnSel);

        tdAcoes.appendChild(divBtns);
        tr.appendChild(tdAcoes);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      divTabela.appendChild(table);
    }

    // ---------- FILTRO ----------
    txtFiltroCargo.addEventListener("input", function () {
      const filtro = this.value.trim().toLowerCase();
      if (!API_DATA || !API_DATA.cargos) return;
      const filtrados = {
        cargos: API_DATA.cargos.filter(c => c.nomeCargo.toLowerCase().includes(filtro))
      };
      renderTable(filtrados);
      txtId.value = "";
    });

    // ---------- CHECKBOX INATIVOS ----------
    chkMostrarInativos.addEventListener("change", function () {
      // Recarrega a lista com o novo estado (ativos ou inativos)
      listAll();
      // Limpa o filtro de nome ao trocar a visualização
      txtFiltroCargo.value = "";
    });

    // ---------- INICIALIZAR ----------
    listAll();
  </script>
</body>

</html>
