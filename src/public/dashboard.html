<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel | UNIVAP - Controle de Faltas</title>
  <link href="css/univap-theme.css" rel="stylesheet" />
  <style>
    /* Só o que é exclusivo desta tela: os cartões de atalho dos módulos.
       Layout, cards, títulos e cores vêm do css/univap-theme.css. */
    .modulos {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .modulo-link {
      display: block;
      height: 100%;
      border: 1px solid var(--univap-cinza-borda);
      border-left: 4px solid var(--univap-azul);
      border-radius: 6px;
      padding: 16px 18px;
      text-decoration: none;
      background: #ffffff;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .modulo-link:hover,
    .modulo-link:focus {
      background: var(--univap-azul-claro);
      border-left-color: var(--univap-vermelho);
      transform: translateY(-2px);
    }
    .modulo-titulo {
      display: block;
      font-size: 14.5px;
      font-weight: bold;
      color: var(--univap-azul-escuro);
      margin-bottom: 6px;
    }
    .modulo-descricao {
      display: block;
      font-size: 12.5px;
      color: var(--univap-texto-suave);
      line-height: 1.5;
    }

    .aviso-sem-modulos {
      font-size: 13px;
      color: var(--univap-texto-suave);
      margin: 0;
    }

    @media (max-width: 700px) {
      .modulos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app-topbar"></div>

  <main class="conteudo-pagina" id="conteudo-principal">
    <div class="page-title">
      <h1 id="titulo-painel">Painel</h1>
      <p id="mensagem-boas-vindas">Escolha um módulo abaixo para começar.</p>
    </div>

    <div class="card">
      <div class="card-header">Acesso rápido</div>
      <div class="card-body">
        <nav aria-label="Acesso rápido aos módulos">
          <ul class="modulos" id="lista-modulos"></ul>
          <p class="aviso-sem-modulos" id="aviso-sem-modulos" hidden>
            Nenhum módulo está liberado para o seu cargo. Procure a coordenação.
          </p>
        </nav>
      </div>
    </div>
  </main>

  <script type="module">
    import { exigirSessao, montarTopbar, paginasPermitidas, escaparHtml } from './js/Topbar.js';

    const sessao = exigirSessao();

    if (sessao) {
      montarTopbar('dashboard');

      // ---------- SAUDAÇÃO COM O NOME DE QUEM ESTÁ LOGADO ----------
      const primeiroNome = (sessao.nome || '').trim().split(/\s+/)[0];
      const titulo = document.getElementById('titulo-painel');
      const mensagem = document.getElementById('mensagem-boas-vindas');

      if (primeiroNome) {
        titulo.textContent = 'Olá, ' + primeiroNome + '!';
        mensagem.innerHTML = 'Você está no <strong>Sistema de Controle de Faltas</strong>'
          + (sessao.cargo ? ' como <strong>' + escaparHtml(sessao.cargo) + '</strong>' : '')
          + '. Escolha abaixo o módulo que deseja usar.';
      } else {
        mensagem.textContent = 'Escolha abaixo o módulo que deseja usar.';
      }

      // ---------- ATALHOS FILTRADOS PELO CARGO ----------
      // Usa a mesma regra do menu (paginasPermitidas), para que os atalhos nunca
      // ofereçam um módulo que a barra de navegação esconde.
      const modulos = paginasPermitidas(sessao.cargo).filter(pagina => pagina.chave !== 'dashboard');
      const lista = document.getElementById('lista-modulos');

      lista.innerHTML = modulos.map(pagina => `
        <li>
          <a class="modulo-link" href="${pagina.href}">
            <span class="modulo-titulo">${escaparHtml(pagina.label)}</span>
            <span class="modulo-descricao">${escaparHtml(pagina.descricao)}</span>
          </a>
        </li>
      `).join('');

      document.getElementById('aviso-sem-modulos').hidden = modulos.length > 0;
    }
  </script>
</body>

</html>
